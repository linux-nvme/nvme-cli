#
# Checks of generated files and of the libnvme ABI.

name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels its older run. Each push to
  # master gets a run of its own, to show which commit broke something.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Verify that all committed generated accessor files (.h, .c, .i, .ld)
  # are in sync with the generate-accessors tool and the annotated
  # private*.h files.
  #
  # .h, .c, and .i files must be byte-identical to what the generator
  # produces. .ld files are checked at the symbol level: the committed
  # file may carry different version-section labels but must export the
  # same set of symbols.
  #
  # If this check fails:
  #   - For .h/.c/.i: run 'meson compile -C <build-dir> update-accessors'
  #                   and commit the result.
  #   - For .ld:      manually add/remove the symbols listed in the
  #                   WARNING and commit the result.
  check-accessors:
    name: check generated accessor files are up to date
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linux-nvme/debian:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: meson setup .build-ci -Dcheck-accessors=true
      - name: Check generated accessor files are in sync
        run: meson compile -C .build-ci update-accessors

  # Verify that the committed shell completion files are in sync with the
  # generate-completions.py tool and the command/option metadata dumped
  # by the freshly built nvme binary.
  #
  # The bash, zsh, and PowerShell files must be byte-identical to what
  # the generator produces from a default build (all plugins).
  #
  # If this check fails, run:
  #   meson compile -C <build-dir> update-completions
  # and commit the result.
  check-completions:
    name: check generated completion files are up to date
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linux-nvme/debian:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: meson setup .build-ci
      - name: Check completion files are in sync
        run: meson compile -C .build-ci check-completions

  libnvme-abi:
    # Starting with the 3.0 release, libnvme's exported symbols must not
    # change in an incompatible way (removed or renamed functions/variables,
    # or a changed symbol version) once they have shipped in a release --
    # including symbols added after 3.0: once a symbol ships, it stays.
    #
    # It is fine to add and remove symbols freely between two releases
    # (e.g. an experimental accessor added and renamed before it ships), so
    # the baseline for comparison is always the latest released tag, not
    # the previous commit. New struct/enum fields and new accessors driven
    # by NVMe spec updates are expected and fine; only the exported symbol
    # table is checked here, not struct layouts.
    name: libnvme exported symbols
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linux-nvme/debian:latest
    # Container jobs default to "sh" rather than bash; the comparison step
    # below relies on bash's PIPESTATUS array.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory '*'

      - name: Install libabigail
        run: |
          apt-get update
          apt-get install -y --no-install-recommends abigail-tools

      - name: Determine ABI baseline
        id: baseline
        run: |
          baseline=""
          for tag in $(git tag --list 'v*' | grep -E '^v([3-9][0-9]*)\.[0-9]+(\.[0-9]+)?$' | sort -rV); do
            if git merge-base --is-ancestor "${tag}" HEAD 2>/dev/null; then
              baseline="${tag}"
              break
            fi
          done

          if [ -z "${baseline}" ]; then
            echo "No released >=3.0 tag reachable from HEAD; skipping ABI check."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse "${baseline}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is the ${baseline} release itself; skipping ABI check."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing libnvme ABI against ${baseline}"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "tag=${baseline}" >> "$GITHUB_OUTPUT"
          fi

      # Uses the baseline tag's own scripts/build.sh, which predates the
      # libnvme_abi config below -- so it still builds and runs the test
      # suite via the "libnvme" config. Only the symbol table is needed,
      # not the test results.
      - name: Build baseline libnvme (${{ steps.baseline.outputs.tag }})
        if: steps.baseline.outputs.skip == '0'
        run: |
          git worktree add /tmp/abi-baseline "${{ steps.baseline.outputs.tag }}"
          ( cd /tmp/abi-baseline && scripts/build.sh -c gcc libnvme )

      - name: Build current libnvme
        if: steps.baseline.outputs.skip == '0'
        run: scripts/build.sh -c gcc libnvme_abi

      - name: Compare exported symbols with abidiff
        if: steps.baseline.outputs.skip == '0'
        run: |
          old_so=$(find /tmp/abi-baseline/.build-ci -name 'libnvme3.so.*' -type f ! -path '*.p/*' | sort -V | tail -1)
          new_so=$(find .build-ci -name 'libnvme3.so.*' -type f ! -path '*.p/*' | sort -V | tail -1)

          if [ -z "${old_so}" ] || [ -z "${new_so}" ]; then
            echo "::error::could not locate a built libnvme3.so to compare"
            exit 1
          fi

          echo "baseline (${{ steps.baseline.outputs.tag }}): ${old_so}"
          echo "current:                      ${new_so}"

          # Built without debug info (release buildtype), so abidiff falls
          # back to comparing the ELF dynamic symbol tables -- i.e. exactly
          # the exported symbols/versions, not struct layouts. Exit status
          # is a bitmask; bit 0x08 means an incompatible ABI change was
          # found (e.g. a removed or changed exported symbol). Bit 0x04
          # (any change at all, including purely additive ones such as new
          # symbols added for spec updates) is expected and must not fail
          # the build.
          set +e
          abidiff "${old_so}" "${new_so}" | tee abidiff.log
          status=${PIPESTATUS[0]}
          set -e

          # Bits 0x01 (error) and 0x02 (usage error) mean abidiff itself
          # failed to run the comparison at all -- treat that as a failure
          # too, not as "no incompatible change found".
          if [ $((status & 3)) -ne 0 ]; then
            echo "::error::abidiff failed to run (exit status ${status})"
            exit 1
          fi

          if [ $((status & 8)) -ne 0 ]; then
            echo "::error::libnvme exported symbols changed incompatibly since ${{ steps.baseline.outputs.tag }}"
            exit 1
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: abidiff-report
          path: abidiff.log
