# The public status page: the nightly results and the clang analyzer
# report. scripts/nightly/nvme-nightly builds it as a plain directory;
# this workflow only collects its inputs and uploads it.

name: Status page

on:
  workflow_run:
    workflows: ["Nightly analyzers", "Nightly tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  publish-status-page:
    if: ${{ github.repository == 'linux-nvme/nvme-cli' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      PAGE_URL: https://linux-nvme.github.io/nvme-cli/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the latest reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          # The latest run of a workflow of the default branch, scheduled
          # or started by hand, with its jobs: into the directory $2.
          latest() {
            local run
            run="$(gh run list -R "${GITHUB_REPOSITORY}" -w "$1" -b master \
                -s completed -L 1 \
                --json databaseId -q '.[0].databaseId')"
            [ -n "${run}" ] || return 0
            mkdir -p "$2"
            gh api "${api}/runs/${run}" > "$2/run.json" &&
                gh api "${api}/runs/${run}/jobs?per_page=100" \
                    > "$2/jobs.json" || rm -f "$2/run.json"
            echo "${run}"
          }
          run="$(latest nightly-analyzers.yml reports/analyzers)"
          if [ -n "${run}" ]; then
            gh run download "${run}" -R "${GITHUB_REPOSITORY}" \
                -n clang-analyzer-report -D reports/analyzer || true
          fi
          run="$(latest nightly-tests.yml reports/nightly)"
          if [ -n "${run}" ]; then
            gh run download "${run}" -R "${GITHUB_REPOSITORY}" \
                -p 'artifact-*' -D reports/nightly/artifacts || true
            # The logs of the jobs which ran tests, for the links to the
            # lines of the failed ones.
            for job in nightly-tests test-coverage; do
              id="$(jq -r --arg n "${job}" \
                  '.jobs[] | select(.name == $n) | .id' \
                  reports/nightly/jobs.json 2>/dev/null || true)"
              [ -n "${id}" ] || continue
              curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "${GITHUB_API_URL}/${api}/jobs/${id}/logs" \
                  -o "reports/nightly/log-${job}.log" ||
                  rm -f "reports/nightly/log-${job}.log"
            done
          fi

      - name: Build the page
        run: |
          # scan-build writes one directory per run. It writes none when
          # it finds nothing.
          analyzer="$(find reports/analyzer -mindepth 1 -maxdepth 1 -type d \
              2>/dev/null | head -n 1)"
          if [ -z "${analyzer}" ]; then
            analyzer=reports/no-analyzer-report
            mkdir -p "${analyzer}"
            printf '<!DOCTYPE html>\n<title>clang analyzer</title>\n<p>No reports.</p>\n' \
              > "${analyzer}/index.html"
          fi
          nightly=scripts/nightly/nvme-nightly
          # A report which is not there adds no section: the record still
          # has the conclusions of the jobs and steps. Without a record the
          # page still builds, from the history.
          report() {
            find reports/nightly/artifacts -path "$1" -type f 2>/dev/null |
                head -n 1
          }
          records=()
          if [ -s reports/nightly/run.json ]; then
            vm=nightly-tests
            python3 "${nightly}" night \
                --run reports/nightly/run.json \
                --jobs reports/nightly/jobs.json \
                --job-log nightly-tests=reports/nightly/log-nightly-tests.log \
                --job-log test-coverage=reports/nightly/log-test-coverage.log \
                --section blktests \
                    blktests "${vm}/Run blktests in VM" \
                    "$(report '*/blktests-summary.json')" \
                --section meson 'unit tests (blktests VM)' \
                    "${vm}/Run blktests in VM" \
                    "$(report '*/meson-testlog.json')" \
                --section meson 'nvme-cli tests' \
                    "${vm}/Run nvme-cli tests in VM" \
                    "$(report '*/nvmetests/meson-logs/testlog.json')" \
                --section wringer nvme-discoverd \
                    "${vm}/Run daemon tests in VM" \
                    "$(report '*/discoverd-wringer.log')" \
                --section wringer nvme-keysd \
                    "${vm}/Run daemon tests in VM" \
                    "$(report '*/keysd-wringer.log')" \
                --section meson 'test suite' \
                    'test-coverage/Run the test suite' \
                    "$(report '*/artifact-test-coverage/.build-ci/meson-logs/testlog.json')" \
                --section meson 'fuzz seeds' \
                    'test-coverage/Run the fuzz seeds' \
                    "$(report '*/artifact-test-coverage/.build-ci/meson-logs/testlog-fuzz.json')" \
                --logs reports/logs -o reports/nightly.json &&
                records+=(--record reports/nightly.json)
          fi
          if [ -s reports/analyzers/run.json ]; then
            python3 "${nightly}" night \
                --run reports/analyzers/run.json \
                --jobs reports/analyzers/jobs.json \
                -o reports/analyzers.json &&
                records+=(--record reports/analyzers.json)
          fi
          # The CI image has the jinja2 of the page templates.
          docker run --rm -v "${PWD}:/w" -w /w \
              ghcr.io/linux-nvme/debian:latest \
              "${nightly}" site -o site \
                  --history "${PAGE_URL}history.json" \
                  "${records[@]}" \
                  --logs reports/logs \
                  --analyzer "${analyzer}" \
                  --link "Codecov=https://app.codecov.io/gh/${GITHUB_REPOSITORY}" \
                  --link "Known failures=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues?q=is%3Aissue+is%3Aopen+label%3Ablktests-known-failure"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
