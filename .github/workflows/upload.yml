name: Upload

on:
  push:
    branches: [master]

jobs:
  build-static:
    name: build static binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linux-nvme/debian:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh static
          mkdir upload
          cp .build-ci/nvme upload/nvme-cli-latest-x86_64

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: upload artifacts to github
        with:
          name: nvme-cli
          path: upload/*

  update-nightly-release:
    name: update nightly release
    runs-on: ubuntu-latest
    needs: build-static
    if: ${{ github.event_name == 'push' && github.repository == 'linux-nvme/nvme-cli' }}
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nvme-cli
          path: upload

      - name: Update nightly release
        run: |
          # The nightly tag follows master. It does not match 'v*', so
          # it does not trigger release.yml.
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref=refs/tags/nightly -f sha="${GITHUB_SHA}" >/dev/null
          fi
          notes="Static build of master at ${GITHUB_SHA}."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --notes "${notes}"
          else
            gh release create nightly --prerelease --latest=false \
              --title nightly --notes "${notes}"
          fi
          gh release upload nightly upload/nvme-cli-latest-x86_64 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
