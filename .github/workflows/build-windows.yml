# Builds nvme-cli with MSYS2 and runs the unit tests on x86_64 and ARM64.
# scripts/build.sh configures with --werror, so any compiler warning fails
# the build.

name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels its older run. Each push to
  # master gets a run of its own, to show which commit broke something.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-msys2-ucrt64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-python-jsonschema

      - name: Build nvme-cli
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          which bash
          bash --version
          which git
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh -b release -c /ucrt64/bin/gcc

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: windows-msys2-ucrt64-logs
          path: |
            .build-ci/meson-logs/*.txt

  # This job uses clang rather than gcc because MSYS2 has no gcc toolchain for
  # native Windows-on-ARM64: CLANGARM64 is its only aarch64 environment, and
  # gcc's aarch64-w64-mingw32 target exists only as an experimental
  # cross-compiler (mingw-w64-cross-mingwarm64-gcc, still versioned 15.0.1dev).
  # Note that "pacman -S mingw-w64-clang-aarch64-gcc" does resolve, but it is a
  # virtual package satisfied by mingw-w64-clang-aarch64-gcc-compat, which only
  # installs gcc-named aliases for clang -- not a second compiler.
  windows-msys2-clangarm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-ccache
            mingw-w64-clang-aarch64-json-c
            mingw-w64-clang-aarch64-libarchive
            mingw-w64-clang-aarch64-python-jsonschema

      - name: Build nvme-cli
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          which bash
          bash --version
          which git
          git --version
          clang --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh -b release -c /clangarm64/bin/clang

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: windows-msys2-clangarm64-logs
          path: |
            .build-ci/meson-logs/*.txt
