name: Build FreeBSD

# A build time check only: cross-platform-action boots a FreeBSD VM with
# QEMU on a GitHub hosted runner. There is no NVMe device in it.
on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels its older run. Each push to
  # master gets a run of its own, to show which commit broke something.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Start the FreeBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '15.1'
          cpu_count: 4
      - name: Install the dependencies
        run: |
          sudo pkg install -y git meson ninja pkgconf json-c openssl
      - name: Build and test
        run: |
          set -ex
          uname -a
          meson setup .build
          ninja -C .build
          meson test -C .build
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: upload logs
        if: failure()
        with:
          name: FreeBSD logs files
          path: |
            .build/meson-logs/*.txt
