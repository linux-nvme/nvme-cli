---
# SPDX-License-Identifier: GPL-2.0-or-later
#
# This file is part of nvme.
#
# Builds the dependencies of the nightly tests that Fedora does not
# ship in a recent enough version (see scripts/ci-deps.sh) and uploads
# them to the ci-deps release. The nightly tests install them from
# there. If this build fails, the release keeps the last good build.

name: CI dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 03 1 * *'
  push:
    branches: [master]
    paths:
      - scripts/ci-deps.sh
      - .github/workflows/ci-deps.yml

permissions:
  contents: read

jobs:
  build:
    name: build dependencies
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'linux-nvme/nvme-cli' }}
    runs-on: ubuntu-latest
    # The Fedora version of the nightly test VM.
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install build dependencies
        run: |
          dnf install -y git gcc make pkgconf-pkg-config systemd-devel \
            autoconf automake gnutls-devel glib2-devel libnl3-devel \
            keyutils-libs-devel

      - name: Build
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/scripts/ci-deps.sh" build \
            "${GITHUB_WORKSPACE}/ci-deps"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-deps
          path: ci-deps/*

  update-release:
    name: update ci-deps release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    concurrency:
      group: ci-deps-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ci-deps
          path: ci-deps

      - name: Update ci-deps release
        run: |
          # The ci-deps tag marks the commit of the last build. It does
          # not match 'v*', so it does not trigger release.yml.
          if gh api "repos/${GH_REPO}/git/ref/tags/ci-deps" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/ci-deps" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref=refs/tags/ci-deps -f sha="${GITHUB_SHA}" >/dev/null
          fi
          notes="Dependencies of the nightly tests, built from scripts/ci-deps.sh at ${GITHUB_SHA}."
          if gh release view ci-deps >/dev/null 2>&1; then
            gh release edit ci-deps --notes "${notes}"
          else
            gh release create ci-deps --prerelease --latest=false \
              --title ci-deps --notes "${notes}"
          fi
          gh release upload ci-deps ci-deps/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
