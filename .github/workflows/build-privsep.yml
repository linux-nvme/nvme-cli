name: Build privsep

# Privilege separation (Linux only) and the decoder sandbox (Linux and
# FreeBSD) are disabled by default for now. Build and test them here, so
# they do not bitrot: scripts/build.sh privsep. See Documentation/PRIVSEP.md.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels its older run. Each push to
  # master gets a run of its own, to show which commit broke something.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  privsep-linux:
    name: privsep and sandbox on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/linux-nvme/fedora:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The privsep tests skip as root, and the sandbox runs in process
      # under valgrind: run them as a user, without valgrind.
      - name: Add a user for the tests
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"
      - name: build
        run: |
          runuser -u ci -- scripts/build.sh -b debug -c gcc privsep
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: upload logs
        if: failure()
        with:
          name: privsep logs files
          path: |
            .build-ci/meson-logs/*.txt

  privsep-freebsd:
    name: sandbox on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Start the FreeBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '15.1'
          cpu_count: 4
      - name: Install the dependencies
        run: |
          sudo pkg install -y bash git meson ninja pkgconf json-c openssl
      - name: build
        run: |
          set -ex
          uname -a
          bash scripts/build.sh -b debug -c cc privsep
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: upload logs
        if: failure()
        with:
          name: privsep FreeBSD logs files
          path: |
            .build-ci/meson-logs/*.txt
