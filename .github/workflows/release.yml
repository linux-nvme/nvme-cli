name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build.sh

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'linux-nvme/nvme-cli'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create Release
        run: |
          args=(--generate-notes)
          # rc/alpha/beta tags (e.g. v3.0-rc1) are pre-releases and must
          # not be eligible for GitHub's "Latest release" label.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-static:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linux-nvme/debian:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build
        run: |
          scripts/build.sh static
          VERSION="$(git describe --always --abbrev=12 --dirty)"
          mkdir upload
          cp .build-ci/nvme "upload/nvme-cli-${VERSION}-x86_64"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-static
          path: upload/*

  build-windows-static:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-json-c
      - name: build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build.sh -c /ucrt64/bin/gcc static_windows
          VERSION="$(git describe --always --abbrev=12 --dirty)"
          mkdir upload
          cp .build-ci/nvme.exe "upload/nvme-cli-${VERSION}-x86_64.exe"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-static
          path: upload/*

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [create-release, build-linux-static, build-windows-static]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: upload
          merge-multiple: true
      - name: Upload binaries
        run: |
          gh release upload "${GITHUB_REF_NAME}" upload/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
