name: Checkpatch Review
on: [pull_request]
jobs:
  checkpatch:
    name: checkpatch review
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Fetch checkpatch.pl
      run: |
        curl -sSf \
          https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl \
          -o checkpatch.pl

    # --git checks each commit on its own. Piping a whole series in as
    # one patch makes the author's Signed-off-by in every commit after
    # the first a "Duplicate signature".
    #
    # checkpatch doesn't recognize __cleanup_* declarations (e.g.
    # __cleanup_free, __cleanup_fd) as variable declarations, so it
    # misreports "Missing a blank line after declarations" whenever one
    # sits next to another declaration. Known false positive: drop it
    # before deciding pass/fail. checkpatch's own exit code is ignored
    # in favor of checking the filtered output for anything real left.
    - name: Run checkpatch review
      run: |
        perl checkpatch.pl --git origin/${{ github.base_ref }}..HEAD \
          > checkpatch.log 2>&1 || true
        perl -ne '
          if (/^WARNING: Missing a blank line after declarations/) {
            $warning = $_;
            $context = <>;
            $prev = <>;
            $cur = <>;
            if ($prev =~ /__cleanup/ || $cur =~ /__cleanup/) {
              next;
            }
            print $warning, $context, $prev, $cur;
            next;
          }
          print;
        ' checkpatch.log | tee checkpatch-filtered.log
        ! grep -qE '^(ERROR|WARNING):' checkpatch-filtered.log
