name: Checkpatch Review
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 02 * * *'

# A pull request reads only the caches of its own branch and of the
# default branch. So only a run on the default branch saves the copy of
# checkpatch.pl. A scheduled run always runs there.
jobs:
  refresh:
    name: refresh checkpatch.pl
    if: ${{ github.event_name != 'pull_request' &&
            github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
    - name: Fetch checkpatch.pl
      run: |
        curl -sSf \
          https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl \
          -o checkpatch.pl
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: checkpatch.pl
        key: checkpatch-${{ github.run_id }}

  checkpatch:
    name: checkpatch review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    # The newest saved copy. No key is an exact match.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: checkpatch.pl
        key: checkpatch-
        restore-keys: checkpatch-
    - name: Fetch checkpatch.pl if no copy was saved
      run: |
        [ -f checkpatch.pl ] && exit 0
        curl -sSf \
          https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl \
          -o checkpatch.pl

    # --git checks each commit on its own. Piping a whole series in as
    # one patch makes the author's Signed-off-by in every commit after
    # the first a "Duplicate signature".
    #
    # scripts/checkpatch-filter.pl drops known false positives and sets
    # the exit status. The shell does not use pipefail, so checkpatch's
    # own exit status is ignored.
    - name: Run checkpatch review
      run: |
        perl checkpatch.pl --git origin/${{ github.base_ref }}..HEAD 2>&1 |
          perl scripts/checkpatch-filter.pl
