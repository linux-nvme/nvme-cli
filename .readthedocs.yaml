#
# The guide in Documentation/guide, built with Sphinx. Its conf.py copies
# the HTML man pages (Documentation/*.html) next to the guide pages.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    - requirements: Documentation/guide/requirements.txt

sphinx:
  configuration: Documentation/guide/conf.py
  fail_on_warning: true

formats: []
